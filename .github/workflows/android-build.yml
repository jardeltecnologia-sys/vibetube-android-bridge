name: Build VibeTube APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Show project structure
        run: |
          pwd
          ls -la
          ls -la mobile/android
          ls -la mobile/android/app

      - name: Fix Gradle wrapper permission
        working-directory: mobile/android
        run: |
          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
          fi

      - name: Generate Gradle wrapper if missing
        working-directory: mobile/android
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.4
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: find . -type f -name "*.apk" -print

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/debug/*.apk artifacts/
          ls -la artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibetube-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
